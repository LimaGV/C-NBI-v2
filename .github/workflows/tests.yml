name: Infrastructure

on:
  push:
    branches: ["main", "feature/**", "experiment/**", "fix/**", "docs/**", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install pinned Python 3.12
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Infrastructure tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy src
      - name: Report environment
        run: uv run python scripts/verify_environment.py
